
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brawl 3D Arena</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>

  <div id="game"></div>

  <section id="start" class="screen">
    <h1>BRAWL 3D ARENA</h1>
    <p>La bataille commence ici !</p>
    <button id="startBtn">START</button>
  </section>

  <section id="lobby" class="hidden">
    <header>
      <div class="logo">BRAWL 3D</div>
      <div class="coins">🪙 <span id="coins">500</span></div>
      <nav>
        <button data-menu="characters">BRAWLERS</button>
        <button data-menu="skins">SKINS</button>
        <button data-menu="maps">MAPS</button>
        <button data-menu="shop">BOUTIQUE</button>
      </nav>
    </header>

    <div class="lobbyInfo">
      <h2>TON LOBBY</h2>
      <p id="lobbyCharacter">Brawler Classique</p>
      <button id="playBtn">⚔ JOUER</button>
    </div>
  </section>

  <section id="collection" class="hidden">
    <div class="collectionBox">
      <h2 id="collectionTitle">COLLECTION</h2>
      <div id="items"></div>
      <button id="backBtn">RETOUR</button>
    </div>
  </section>

  <section id="hud" class="hidden">
    <div class="stats">
      ❤️ <span id="health">100</span>
      <br>⭐ <span id="kills">0</span>
      <br>🪙 <span id="matchCoins">0</span>
    </div>

    <div id="crosshair">+</div>

    <div class="bottomHud">
      <button id="superBtn">SUPER</button>
      <button id="shootBtn">TIR</button>
    </div>

    <div id="gameMessage"></div>
    <button id="leaveBtn">QUITTER</button>
  </section>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
