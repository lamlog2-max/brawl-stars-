
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arena Brawl</title>
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="menu">
    <h1>ARENA BRAWL</h1>
    <h3>TOUS CONTRE TOUS</h3>
    <p>Bienvenue dans l'arène !</p>
    <input id="playerName" maxlength="16" value="Joueur" placeholder="Ton pseudo">
    <button id="playButton">JOUER</button>
    <p id="status">Prêt à combattre !</p>
    <p class="instructions">
      W A S D : bouger<br>
      Souris : regarder<br>
      Clic gauche : tirer<br>
      Espace : super attaque
    </p>
  </div>

  <div id="hud" class="hidden">
    <div class="top">
      <span>🏆 <b id="trophies">0</b></span>
      <span>Éliminations : <b id="kills">0</b></span>
      <span>Joueurs : <b id="players">1</b>/10</span>
    </div>
    <div id="crosshair">+</div>
    <div class="bottom">
      <span>❤️ <b id="health">100</b></span>
      <span>Super : <b id="super">0</b>%</span>
      <button id="pauseButton">PAUSE</button>
    </div>
  </div>

  <div id="pausePanel" class="panel hidden">
    <h2>PAUSE</h2>
    <button id="resumeButton">REPRENDRE</button>
    <button id="menuButton">MENU</button>
  </div>

  <div id="skinPanel" class="panel hidden">
    <h2>SKINS DÉBLOQUÉS</h2>
    <p id="skinList"></p>
    <button id="closeSkins">FERMER</button>
  </div>

  <div id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
